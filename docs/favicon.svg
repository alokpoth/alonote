<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5e5ea"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="3" filter="url(#subtleShadow)"/>

  <!-- Minimalist Note Sheet Surface -->
  <rect x="116" y="104" width="280" height="304" rx="26" fill="#242426" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Note Header Bar -->
  <rect x="152" y="146" width="76" height="10" rx="5" fill="#8e8e93" opacity="0.6"/>
  <circle cx="352" cy="151" r="7" fill="#8e8e93" opacity="0.4"/>
  
  <!-- Iconic N Monogram with smooth geometry -->
  <path d="M 164 340 L 164 196 C 164 189.5 169.5 184 176 184 L 192 184 C 197.5 184 202.5 187 205.5 191.5 L 306.5 316.5 L 306.5 196 C 306.5 189.5 312 184 318.5 184 L 334.5 184 C 341 184 346.5 189.5 346.5 196 L 346.5 340 C 346.5 346.5 341 352 334.5 352 L 318.5 352 C 313 352 308 349 305 344.5 L 204 219.5 L 204 340 C 204 346.5 198.5 352 192 352 L 176 352 C 169.5 352 164 346.5 164 340 Z" fill="url(#glyphGrad)"/>

  <!-- Bottom Accent Ruler -->
  <line x1="152" y1="376" x2="360" y2="376" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-linecap="round"/>
</svg>
